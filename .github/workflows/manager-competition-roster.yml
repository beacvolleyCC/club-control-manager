name: Manager competition training roster QA
on:
  push:
    branches: [main]
    paths:
      - app.js
      - styles.css
      - tests/competition-training-roster.test.cjs
      - tests/player-team-filter.test.cjs
      - competition-context-catalog.js
      - tests/competition-context-catalog.test.cjs
      - tests/league-context-ui.test.cjs
      - tests/league-matches-page.test.cjs
      - tests/mass-cancellations-panel.test.cjs
      - tests/mass-today-visibility.test.cjs
      - tests/mass-archive-access.test.cjs
      - tests/mass-event-safe-edit.test.cjs
      - supabase/migrations/20261015173000_cc_manager_mass_cancellations_read_v1.sql
      - tests/competition-match-integrity.test.cjs
      - tests/brsz-mobile-html-import.test.cjs
      - tests/competition-change-audit.test.cjs
      - tests/manager-standings-filters.test.cjs
      - tests/mrsz-snapshot-stats.test.cjs
      - tests/mrsz-saved-results-stats.test.cjs
      - tests/mrsz-team-identity.test.cjs
      - tests/mrsz-review-records.test.cjs
      - tests/mrsz-data-coverage.test.cjs
      - tests/scoreboard-match-cards.test.cjs
      - supabase/migrations/20261014153502_cc_manager_competition_change_audit_readonly_v1.sql
      - tests/competition-source-identity.test.cjs
      - supabase/migrations/20261014135156_cc_sync_identity_ambiguous_pair_preserve_v2.sql
      - supabase/migrations/20261014125538_cc_preserve_competition_match_identity_v1.sql
      - tests/competition-league-fixture-reference.test.cjs
      - tests/mrsz-screenshot-finance.test.cjs
      - tests/mrsz-fixture-merge.test.cjs
      - .github/workflows/manager-competition-roster.yml
  pull_request:
    paths:
      - app.js
      - styles.css
      - tests/competition-training-roster.test.cjs
      - tests/player-team-filter.test.cjs
      - competition-context-catalog.js
      - tests/competition-context-catalog.test.cjs
      - tests/league-context-ui.test.cjs
      - tests/league-matches-page.test.cjs
      - tests/mass-cancellations-panel.test.cjs
      - tests/mass-today-visibility.test.cjs
      - tests/mass-archive-access.test.cjs
      - tests/mass-event-safe-edit.test.cjs
      - supabase/migrations/20261015173000_cc_manager_mass_cancellations_read_v1.sql
      - tests/competition-match-integrity.test.cjs
      - tests/brsz-mobile-html-import.test.cjs
      - tests/competition-change-audit.test.cjs
      - tests/manager-standings-filters.test.cjs
      - tests/mrsz-snapshot-stats.test.cjs
      - tests/mrsz-saved-results-stats.test.cjs
      - tests/mrsz-team-identity.test.cjs
      - tests/mrsz-review-records.test.cjs
      - tests/mrsz-data-coverage.test.cjs
      - tests/scoreboard-match-cards.test.cjs
      - supabase/migrations/20261014153502_cc_manager_competition_change_audit_readonly_v1.sql
      - tests/competition-source-identity.test.cjs
      - supabase/migrations/20261014135156_cc_sync_identity_ambiguous_pair_preserve_v2.sql
      - supabase/migrations/20261014125538_cc_preserve_competition_match_identity_v1.sql
      - tests/competition-league-fixture-reference.test.cjs
      - tests/mrsz-screenshot-finance.test.cjs
      - tests/mrsz-fixture-merge.test.cjs
      - .github/workflows/manager-competition-roster.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  competition-roster:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Manager JavaScript
        run: node --check app.js
      - name: Validate status colors and position-grouped foldout
        run: |
          node tests/nav-regression.test.cjs
          node tests/player-team-filter.test.cjs
          node --test tests/competition-context-catalog.test.cjs
          node --test tests/league-context-ui.test.cjs
          node --test tests/league-matches-page.test.cjs
          node --test tests/mass-cancellations-panel.test.cjs
          node --test tests/mass-today-visibility.test.cjs
          node --test tests/mass-archive-access.test.cjs
          node --test tests/mass-event-safe-edit.test.cjs
          node --test tests/competition-training-roster.test.cjs
          node --test tests/competition-match-integrity.test.cjs
          node --test tests/brsz-mobile-html-import.test.cjs
          node --test tests/competition-change-audit.test.cjs
          node --test tests/manager-standings-filters.test.cjs
          node --test tests/mrsz-snapshot-stats.test.cjs
          node --test tests/mrsz-saved-results-stats.test.cjs
          node --test tests/mrsz-team-identity.test.cjs
          node --test tests/mrsz-review-records.test.cjs
          node --test tests/mrsz-data-coverage.test.cjs
          node --test tests/competition-source-identity.test.cjs
          node --test tests/competition-league-fixture-reference.test.cjs
          node --test tests/mrsz-screenshot-finance.test.cjs
          node --test tests/mrsz-fixture-merge.test.cjs
          node --test tests/scoreboard-match-cards.test.cjs
