name: TEST Manager and Player preview HTTP smoke
on:
  push:
    branches: [feature/guest-competition-rsvp-20261121]
  workflow_dispatch:
jobs:
  preview-http:
    runs-on: ubuntu-latest
    steps:
      - name: Check TEST previews and frontend config
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://szzoubvhlwnojtzqjebc.supabase.co/functions/v1
          for NAME in cc-manager-preview cc-player-preview; do
            echo "Checking $NAME"
            curl -fsSL --max-time 30 "$BASE/$NAME" > "/tmp/$NAME.html"
            grep -qi 'Club Control' "/tmp/$NAME.html"
            curl -fsSL --max-time 30 "$BASE/$NAME/config.js" > "/tmp/$NAME-config.js"
            grep -q 'szzoubvhlwnojtzqjebc.supabase.co' "/tmp/$NAME-config.js"
            if grep -q 'snqsxlyhontaepembaic.supabase.co' "/tmp/$NAME-config.js"; then echo "LIVE DATABASE DETECTED"; exit 1; fi
            curl -fsSL --max-time 30 "$BASE/$NAME/app.js" > "/tmp/$NAME-app.js"
            test -s "/tmp/$NAME-app.js"
            echo "$NAME: served correct TEST files"
          done
          echo 'Both TEST previews are available and isolated from LIVE'
