name: CC TEST API contracts and modular rebuild audit
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - 'app.js'
      - 'docs/architecture/CC_TEST_API_CONTRACT_INVENTORY_20261029.json'
      - 'tests/cc-test-api-contract-inventory-20261029.test.cjs'
      - '.github/workflows/cc-test-api-contract-inventory-20261029.yml'
  workflow_dispatch:
jobs:
  metadata-contracts:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check snapshot, source and declared security contracts twice
        run: |
          node --check tests/cc-test-api-contract-inventory-20261029.test.cjs
          node --test tests/cc-test-api-contract-inventory-20261029.test.cjs
          node --test tests/cc-test-api-contract-inventory-20261029.test.cjs
