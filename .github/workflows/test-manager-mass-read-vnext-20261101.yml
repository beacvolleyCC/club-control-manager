name: TEST Manager mass-sport read API contract
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - 'docs/security/CC_TEST_MASS_READ_APIS_SQL_EDITOR_INSTALL_20261101.sql'
      - 'tests/sql/CC_TEST_MASS_READ_APIS_ROLLBACK_QA_20261101.sql'
      - 'tests/manager-mass-read-vnext-20261101.test.cjs'
      - '.github/workflows/test-manager-mass-read-vnext-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mass-sport read contract and ACL twice
        run: |
          node --test tests/manager-mass-read-vnext-20261101.test.cjs
          node --test tests/manager-mass-read-vnext-20261101.test.cjs
