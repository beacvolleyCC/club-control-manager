name: Manager guest administration safety QA
on:
  push:
    branches: [feature/live-guest-admin-20261123]
    paths: [app.js,.github/workflows/manager-guest-admin-qa.yml]
  pull_request:
    paths: [app.js,.github/workflows/manager-guest-admin-qa.yml]
  workflow_dispatch:
jobs:
  guest-admin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/nav-regression.test.cjs
      - name: Assert Manager guest CRUD, secure scope, no auth changes
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('app.js','utf8');
          assert.match(src,/\['guests','Vendégek','○'\]/);
          assert.match(src,/if\(area==='mass'&&module==='guests'\)return can\('mass\.athletes'\)/);
          assert.match(src,/if\(state\.area==='mass'&&m==='guests'\)\{renderMassGuests_\(\);return\}/);
          assert.match(src,/if\(can\('mass\.athletes'\)\)jobs\.push\(loadGuests_\(\)/);
          assert.match(src,/const editable=canAction\('mass\.athletes','edit'\)/);
          assert.match(src,/rpc\('cc_guest_admin_list_v1'\)/);
          assert.match(src,/rpc\('cc_guest_admin_save_v1',\{p_payload:payload\}\)/);
          assert.match(src,/document\.querySelectorAll\('\[data-guest-edit\]'\)\.forEach/);
          assert.match(src,/id="ccGuestCopyPin"/);
          assert.match(src,/name="resetPin"/);
          assert.match(src,/teamIds:fd\.getAll\('guestTeam'\)/);
          assert.match(src,/name="active"/);
          assert.match(src,/guestLoadError/);
          assert.match(src,/href="\.\/vendeg\/"/);
          const fn=src.slice(src.indexOf('function renderMassGuests_(){'),src.indexOf('function renderMassAthletes(){'));
          for (const invalid of ['service_role','SUPABASE_SECRET','signInWithOtp','verifyOtp','window.CC_MANAGER_CONFIG='])assert(!fn.includes(invalid),'Unexpected guest-admin auth mutation '+invalid);
          assert(!src.includes('szzoubvhlwnojtzqjebc.supabase.co'),'TEST backend reference found');
          console.log('PASS: authorized guest admin UI, no new login, no TEST API, no singleton collection selector');
          JS
