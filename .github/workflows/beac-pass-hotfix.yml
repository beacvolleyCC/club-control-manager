name: BEAC pass hotfix QA
on:
  pull_request:
    paths:
      - 'app.js'
      - 'tests/beac-pass-hotfix.test.cjs'
      - '.github/workflows/beac-pass-hotfix.yml'
  workflow_dispatch:
jobs:
  pass-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/beac-pass-hotfix.test.cjs
