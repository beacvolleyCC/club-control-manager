name: MANUAL upload DISABLED mass gateway TEST draft (NO DEPLOY)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter exactly UPLOAD_DISABLED_TEST_DRAFT to allow TEST-only version upload'
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/test/20261026-manager-document-intake' && inputs.confirm == 'UPLOAD_DISABLED_TEST_DRAFT'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST identity and no public routes twice
        run: |
          node --test tests/mass-gateway-deploy-preflight-20261101.test.mjs
          node --test tests/mass-gateway-deploy-preflight-20261101.test.mjs
      - name: Verify worker behavior twice
        run: |
          node --test tests/mass-gateway-test-20261101.test.mjs
          node --test tests/mass-gateway-test-20261101.test.mjs
      - name: Validate build without upload
        run: npx --yes wrangler@4 deploy --dry-run --config vnext/mass-gateway/wrangler.jsonc --outdir /tmp/cc-mass-gateway-test-build
  upload-disabled-draft:
    needs: verify
    if: github.ref == 'refs/heads/test/20261026-manager-document-intake' && inputs.confirm == 'UPLOAD_DISABLED_TEST_DRAFT'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: cc-mass-gateway-disabled-test-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a dedicated TEST Cloudflare token and account
        env:
          CF_TEST_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TEST_TOKEN" || { echo "MISSING_TEST_CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "MISSING_CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Upload a DISABLED TEST version only (no deploy, no routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 versions upload --config vnext/mass-gateway/wrangler.jsonc --message "CC TEST only, disabled draft; NO DEPLOY"
          echo "TEST Worker version uploaded only; no deployment or public URL activation was requested"
