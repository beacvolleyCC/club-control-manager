name: TEST completed-training attendance editor QA
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - app.js
      - tests/completed-training-attendance.test.cjs
      - .github/workflows/test-completed-training-attendance-20261104.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attendance-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/completed-training-attendance.test.cjs
