name: Private calendar gate
on:
  pull_request:
    paths:
      - 'sql/cc_private_calendar_feed_*.sql'
      - 'supabase/functions/cc-calendar/**'
      - 'tests/calendar-ics.test.mjs'
      - 'tests/calendar-http.test.mjs'
      - '.github/workflows/private-calendar-gate.yml'
  push:
    branches:
      - 'feat/20261022-private-ios-calendar-phase1'
jobs:
  calendar-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ICS and private HTTP feed
        run: node --test tests/calendar-ics.test.mjs tests/calendar-http.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/cc-calendar/index.ts
      - name: Check bearer auth contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'revoke all on private.cc_calendar_feed_tokens_v1 from public,anon,authenticated' sql/cc_private_calendar_feed_tokens_v1.sql
          grep -q 'grant execute on function public.cc_calendar_feed_read_v1(text) to service_role' sql/cc_private_calendar_feed_read_v1.sql
          grep -Fq "a.status='going'" sql/cc_private_calendar_feed_read_v1.sql
          grep -q 't.revoked_at is null' sql/cc_private_calendar_feed_read_v1.sql
          grep -q 'member' sql/cc_private_calendar_feed_read_v1.sql
          grep -q 'no-store' supabase/functions/cc-calendar/handler.mjs
          grep -q 'verify_jwt = false' supabase/config.toml
          grep -q 'createCalendarHandler(admin)' supabase/functions/cc-calendar/index.ts
          ! grep -q 'SUPABASE_SERVICE_ROLE_KEY' tests/calendar-ics.test.mjs
