name: Five-league canonical crosswalk audit QA
on:
  push:
    branches: [integration/20261022-manager-calendar-protocol-crosswalk-qa]
  pull_request:
    paths:
      - 'sql/audit_five_league_canonical_versus_user_20261022.sql'
      - 'data/competition/2026-27/canonical-legacy-five-league-audit-20261023.json'
      - 'tests/five-league-canonical-audit-20261023.test.cjs'
      - '.github/workflows/five-league-crosswalk-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit source and 300-vs-298 captured results
        run: |
          node --check tests/five-league-canonical-audit-20261023.test.cjs
          node --test tests/five-league-canonical-audit-20261023.test.cjs
      - name: Double independent snapshot validation
        run: |
          node --test tests/five-league-canonical-audit-20261023.test.cjs
          node -e "const x=require('./data/competition/2026-27/canonical-legacy-five-league-audit-20261023.json');if(x.reviewRecords.length!==11||x.staleLegacyFixtureStatus.length!==5)process.exit(1)"
