name: TEST Manager roster effective date security
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - 'docs/security/TEST_MANAGER_PLAYERS_V2_EFFECTIVE_DATE_CANDIDATE_20261029.sql'
      - 'tests/sql/TEST_MANAGER_PLAYERS_V2_EFFECTIVE_DATE_ROLLBACK_20261029.sql'
      - 'tests/manager-roster-effective-date-20261029.test.cjs'
      - '.github/workflows/test-manager-roster-effective-date-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 5 checks twice
        run: |
          node --test tests/manager-roster-effective-date-20261029.test.cjs
          node --test tests/manager-roster-effective-date-20261029.test.cjs
