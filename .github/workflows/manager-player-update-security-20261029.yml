name: CC TEST Manager player profile write security
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - 'docs/security/TEST_MANAGER_PLAYER_UPDATE_CANDIDATE_20261029.sql'
      - 'docs/security/TEST_MANAGER_PLAYER_UPDATE_DEPLOY_20261029.sql'
      - 'tests/manager-player-update-security-20261029.test.cjs'
      - 'tests/sql/TEST_MANAGER_PLAYER_UPDATE_ROLLBACK_20261029.sql'
      - 'tests/sql/TEST_MANAGER_PLAYER_UPDATE_POSTDEPLOY_ROLLBACK_20261029.sql'
      - '.github/workflows/manager-player-update-security-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scoped team rights, input constraints, audit and test fixture twice
        run: |
          node --check tests/manager-player-update-security-20261029.test.cjs
          node --test tests/manager-player-update-security-20261029.test.cjs
          node --test tests/manager-player-update-security-20261029.test.cjs
