name: TEST Cloudflare Workers static assets readiness
on:
  push:
    branches: [test/20261026-manager-document-intake]
    paths:
      - 'wrangler.jsonc'
      - 'scripts/build-cloudflare-test.cjs'
      - 'tests/cloudflare-workers-static-assets-20261030.test.cjs'
      - '.github/workflows/test-cloudflare-workers-static-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST-only deployment contract
        run: node --test tests/cloudflare-workers-static-assets-20261030.test.cjs
      - name: Generate connected TEST bundle
        run: node scripts/build-cloudflare-test.cjs
      - name: Assert compiled STAGING app and test-only endpoint
        run: |
          node -e "const fs=require('fs'),assert=require('assert');const cfg=fs.readFileSync('dist-test/config.js','utf8');const html=fs.readFileSync('dist-test/index.html','utf8');assert(cfg.includes('szzoubvhlwnojtzqjebc.supabase.co'));assert(!cfg.includes('snqsxlyhontaepembaic'));assert(/STAGING.+NEM ÉLES/.test(html));assert(!/sb_secret_|service_role/.test(cfg));"
      - name: Repeat TEST-only deployment contract QA
        run: node --test tests/cloudflare-workers-static-assets-20261030.test.cjs
